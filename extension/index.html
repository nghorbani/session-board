<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessions</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --panel-2: #23272e;
    --line: #2e333c;
    --text: #e6e9ef;
    --dim: #8b93a1;
    --faint: #626a78;
    --wait: #f0b429;
    --busy: #4a9eff;
    --idle: #6b7280;
    --ok: #3fb950;
    --warn: #d29922;
    --crit: #f85149;
  }
  body.vscode {
    --bg: var(--vscode-sideBar-background, #14161a);
    --panel: var(--vscode-editorWidget-background, #1c1f25);
    --panel-2: var(--vscode-list-hoverBackground, #23272e);
    --line: var(--vscode-widget-border, #2e333c);
    --text: var(--vscode-foreground, #e6e9ef);
    --dim: var(--vscode-descriptionForeground, #8b93a1);
    --faint: var(--vscode-disabledForeground, #626a78);
    padding: 8px 6px 24px;
    font-size: 12.5px;
  }
  body.vscode h1 { display: none; }
  body.vscode .row.waiting { background: color-mix(in srgb, var(--wait) 14%, var(--panel)); }
  body.vscode .row.waiting:hover { background: color-mix(in srgb, var(--wait) 22%, var(--panel)); }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 20px 16px 48px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }

  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  .counts { color: var(--dim); font-size: 13px; }
  .counts b { color: var(--text); font-weight: 600; }
  .order { display: inline-flex; margin-left: auto; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .order button { font-size: 11px; padding: 2px 8px; border: none; border-radius: 0; background: var(--panel); color: var(--dim); }
  .order button + button { border-left: 1px solid var(--line); }
  .order button:hover { color: var(--text); border-color: var(--line); background: var(--panel-2); }
  .order button.on { background: var(--panel-2); color: var(--text); }

  .searchbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .searchbar input[type=text] {
    flex: 1; min-width: 160px; font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
  }
  .searchbar input[type=text]:focus { outline: none; border-color: var(--busy); }

  .usage {
    display: none; margin-bottom: 12px; padding: 8px 12px; border-radius: 6px;
    background: var(--panel); border: 1px solid var(--line); font-size: 12px; color: var(--dim);
  }
  .usage.show { display: block; }
  .usage .u-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 22px; }
  .usage .u-head b { color: var(--text); font-weight: 600; }
  .usage .u-acct { color: var(--dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .usage .u-note { color: var(--faint); font-size: 11px; margin-left: auto; white-space: nowrap; }
  /* one grid for all rows so the bars line up whatever the label widths */
  .usage .u-rows { display: grid; grid-template-columns: auto 1fr auto; column-gap: 8px; row-gap: 5px; align-items: center; margin-top: 5px; }
  .usage .u-win { display: contents; }
  .usage .u-win .lbl { min-width: 28px; white-space: nowrap; color: var(--dim); font-variant-numeric: tabular-nums; }
  .usage .u-win .bar { margin-top: 0; }
  .usage .u-win .val { color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .usage .u-win .val .rs { color: var(--faint); }
  .usage .u-win .val.warn { color: var(--warn); }
  .usage .u-win .val.crit { color: var(--crit); }
  .usage button { padding: 0 6px; font-size: 12px; line-height: 1.4; }
  .usage button:disabled { opacity: .6; cursor: default; }
  .usage button:disabled:hover { border-color: var(--line); }
  .usage button.spin { animation: u-spin .9s linear infinite; }
  .usage .u-note .u-msg.warn { color: var(--warn); }
  @keyframes u-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .usage button.spin { animation: none; } }
  .usage .u-stale { margin-top: 5px; color: var(--warn); font-size: 11px; }

  .banner {
    display: none; margin-bottom: 14px; padding: 9px 12px; border-radius: 6px;
    background: #3a2a12; border: 1px solid #6b4c16; color: #f0c674; font-size: 13px;
  }
  .banner.show { display: block; }
  .notice {
    margin-bottom: 14px; padding: 9px 12px; border-radius: 6px;
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
    font-size: 13px; display: none; align-items: center; gap: 10px;
  }
  .notice.show { display: flex; }
  button {
    font: inherit; font-size: 12px; color: var(--text); cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px;
  }
  button:hover { border-color: #414855; }

  .group { margin-bottom: 22px; }
  .group h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .9px;
    color: var(--faint); font-weight: 600; margin: 0 0 8px 2px;
  }
  .group.results h2 { color: var(--busy); }

  /* one section per VS Code window; every head is a button that folds its body */
  .section { margin-bottom: 18px; }
  .section-head { margin: 0 0 8px; }
  .section-head .fold {
    display: flex; align-items: center; gap: 7px; width: 100%; text-align: left;
    background: none; border: none; border-radius: 4px; padding: 2px 2px; margin: 0; color: var(--faint);
    font-size: 11px; text-transform: uppercase; letter-spacing: .9px; font-weight: 600; cursor: pointer;
  }
  .section-head .fold:hover { color: var(--text); border: none; background: var(--panel-2); }
  .section-head .caret { width: 10px; color: var(--faint); }
  .section.waiting > .section-head .label { color: var(--wait); }
  .section.unseen > .section-head .label { color: var(--ok); }
  .section-head .n { color: var(--faint); font-weight: 500; letter-spacing: 0; text-transform: none; }
  .section.folded > .section-body { display: none; }
  .badge {
    display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 9px; text-align: center;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0; line-height: 16px; font-variant-numeric: tabular-nums;
    background: var(--panel-2); color: var(--dim);
  }
  .badge.wait { background: color-mix(in srgb, var(--wait) 28%, var(--panel-2)); color: var(--wait); }
  .badge.unseen { background: color-mix(in srgb, var(--ok) 22%, var(--panel-2)); color: var(--ok); }
  .chip.here { color: var(--busy); border-color: var(--busy); text-transform: none; letter-spacing: 0; font-weight: 500; }
  .chip.muted { color: var(--faint); border-style: dotted; }
  .filterline { color: var(--busy); font-size: 11.5px; margin: 0 2px 10px; }
  .filterline button { margin-left: 8px; font-size: 11px; padding: 0 6px; }
  .row .agent { color: var(--dim); margin-right: 6px; }
  .row.muted .main, .row.muted .status { opacity: .6; }   /* silent and uncounted, still in its place */
  .subhead {
    display: flex; align-items: center; gap: 7px; margin: 10px 0 6px 2px;
    font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .9px;
  }
  .subhead .n { font-weight: 500; letter-spacing: 0; text-transform: none; }

  .row {
    display: grid; grid-template-columns: 1fr 128px 150px 160px;
    gap: 12px; align-items: center; padding: 9px 12px; margin-bottom: 5px;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--idle);
    border-radius: 6px; cursor: pointer;
  }
  .row:hover { border-color: #414855; background: var(--panel-2); }
  .row.waiting { border-left-color: var(--wait); background: #221d12; }
  .row.waiting:hover { background: #2a2417; }
  .row.busy { border-left-color: var(--busy); }
  .row.unseen { border-left-color: var(--ok); }
  .row.past { border-left-color: var(--faint); opacity: .92; }
  .row.copied { border-color: var(--ok); }
  .row.jumped { border-color: var(--busy); }
  .row.ending { opacity: .55; }
  .row.error { border-color: var(--crit); }
  .row.archived { opacity: .6; }
  .chip.archived { color: var(--dim); border-style: dashed; }
  .row > .main { min-width: 0; }   /* lets the title ellipsize instead of pushing the status out of the card */
  .row.manual { grid-template-columns: 16px 1fr 128px 150px 160px; }   /* the handle column, manual mode only */
  .handle { cursor: grab; color: var(--faint); font-size: 13px; letter-spacing: -3px; user-select: none; text-align: center; }
  .handle:hover { color: var(--dim); }
  .row.dragging { opacity: .5; }
  .row.drop-before { box-shadow: 0 -2px 0 0 var(--busy); }
  .row.drop-after { box-shadow: 0 2px 0 0 var(--busy); }
  .row:focus-visible { outline: 1px solid var(--busy); outline-offset: 1px; }

  .title { font-weight: 600; letter-spacing: .1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title.untitled { color: var(--dim); font-weight: 500; font-style: italic; }
  .sub { color: var(--faint); font-size: 11.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub .nm { color: var(--dim); }
  .chip { color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-right: 6px; font-size: 10.5px; }
  .sid { background: none; border: none; padding: 0; margin: 0 6px 0 0; color: var(--faint); font: inherit; font-variant-numeric: tabular-nums; cursor: pointer; }
  .sid:hover { color: var(--text); text-decoration: underline; border: none; background: none; }
  .details { color: var(--faint); font-size: 11px; margin-top: 4px; line-height: 1.6; }
  .details div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .details .k { color: var(--dim); margin-right: 4px; }
  .details .iconbtn { font-size: 11px; padding: 0 3px; }
  .chip.live { color: var(--ok); border-color: var(--ok); }
  .snips { grid-column: 1 / -1; color: var(--dim); font-size: 11.5px; margin-top: 2px; }
  .snips div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row mark { background: color-mix(in srgb, var(--wait) 35%, transparent); color: inherit; border-radius: 2px; }

  .actions { text-align: right; white-space: nowrap; }
  .actions .age { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; margin-right: 4px; }
  .iconbtn {
    background: none; border: none; color: var(--faint); font-size: 14px; padding: 2px 5px;
    margin-left: 2px; line-height: 1; border-radius: 4px;
  }
  .iconbtn:hover { color: var(--text); background: var(--panel-2); border: none; }
  .iconbtn.end:hover { color: var(--crit); }
  .iconbtn.archive:hover, .iconbtn.unarchive:hover { color: var(--busy); }
  .iconbtn.retitle:hover { color: var(--ok); }
  .iconbtn.mute, .iconbtn.unmute { display: inline-flex; align-items: center; vertical-align: middle; }
  .iconbtn.mute:hover, .iconbtn.unmute:hover { color: var(--busy); }
  .iconbtn.confirm { color: var(--crit); font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--crit) 15%, transparent); }
  .status { font-size: 12px; white-space: nowrap; }
  .status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; background: var(--idle); }
  .row.waiting .dot { background: var(--wait); }
  .row.busy .dot { background: var(--busy); }
  .row.unseen .dot { background: var(--ok); }
  .waitfor { color: var(--wait); }
  .row.busy .status span:last-child { color: var(--busy); }
  .row.unseen .status span:last-child { color: var(--ok); }
  .row.idle .status span:last-child { color: var(--dim); }
  .ctx { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .bar { height: 4px; border-radius: 2px; background: #2a2f38; margin-top: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--ok); }
  .bar > i.warn { background: var(--warn); }
  .bar > i.crit { background: var(--crit); }
  .empty { color: var(--faint); font-size: 13px; padding: 6px 2px; }

  @media (max-width: 720px) {
    .row { grid-template-columns: 1fr auto; row-gap: 6px; }
    .row.manual { grid-template-columns: 16px 1fr auto; }
    .status { justify-self: end; }
    .ctx, .actions { grid-column: 1 / -1; }
    .actions { text-align: left; }
    .bar { max-width: 220px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Session Board</h1>
    <div class="counts" id="counts">loading…</div>
    <div class="order" id="sortMode" role="group" aria-label="Order of the rows" style="display:none" title="by activity: waiting, working, unseen, idle; manual: your own order, new sessions on top">
      <button type="button" data-act="mode" data-mode="activity" aria-pressed="true">by activity</button>
      <button type="button" data-act="mode" data-mode="manual" aria-pressed="false">manual</button>
    </div>
  </header>

  <div class="usage" id="usage"></div>

  <div class="searchbar">
    <input type="text" id="q" placeholder="Search…" title="Type to narrow the list. Enter searches every session on disk by title and content; Esc clears." autocomplete="off" spellcheck="false">
  </div>

  <div class="banner" id="banner"></div>
  <div class="notice" id="notice"><span id="noticeText"></span></div>

  <div class="notice" id="notifyNotice">
    <span>Desktop notifications are off, so you will only see waiting sessions when this tab is visible.</span>
    <button id="notifyBtn">Enable</button>
  </div>

  <div class="group results" id="g-results" style="display:none"><h2 id="h-results">Search results</h2><div id="l-results"></div></div>
  <div class="filterline" id="filterline" style="display:none"></div>
  <div id="sections"></div>
  <div class="group" id="g-archived" style="display:none"><h2>Archived</h2><div id="l-archived"></div></div>
</div>

<script>
'use strict';

/*
 * Two hosts, one page. In a browser the page talks to the local server over fetch with the
 * token the server embedded; inside a VS Code webview it talks to the extension over
 * postMessage, which pushes snapshots and performs open/end/search itself.
 */
var vsapi = (typeof acquireVsCodeApi === 'function') ? acquireVsCodeApi() : null;
if (vsapi) document.body.classList.add('vscode');
var tokenMeta = document.querySelector('meta[name="board-token"]');
var TOKEN = tokenMeta ? tokenMeta.getAttribute('content') : '';

var POLL_MS = 4000;
var CONFIRM_MS = 3000;
var MUTE_PENDING_MS = 10000;    // the bell keeps the flag it was clicked to until a snapshot agrees, at most this long
var ORDER_PENDING_MS = 10000;   // a move or a mode switch holds its result until a snapshot agrees, at most this long
var ORDER_QUERY_MAX = 8000;     // the browser route's cap on the comma-joined id list (server.cjs says the same)

var state = {
  data: null,
  showArchived: false,                      // "Show N archived" toggle
  folded: Object.create(null),              // section key -> folded; a section starts open
  pendingMute: Object.create(null),         // sessionId -> { muted, until } from the bell until a snapshot agrees
  details: Object.create(null),             // sessionId -> true while its details line is folded out (memory only)
  pendingOrder: Object.create(null),        // group key -> { ids, until } from a move until a snapshot agrees
  pendingMode: null,                        // { mode, until } from the header switch until a snapshot agrees
  drag: null,                               // { sid, key, over } while a handle is dragged; renders wait for dragend
  renderDue: false,
  filter: '',                               // typed text, re-applied on every render
  search: null,                             // { requestId, query, content, pending, result }
  pendingEnd: Object.create(null),          // sessionId -> { kind: 'confirming'|'pending'|'ended'|'error', archive, pid, until, message }
  prevWaiting: Object.create(null),
  prevUnseenAt: Object.create(null),        // sessionId -> the unseenAt last seen (the browser done Notification)
  known: Object.create(null),               // ids of the last snapshot: a done Notification needs a row seen before
  firstLoad: true,
  flashes: Object.create(null),             // sessionId -> { cls, text, until }
  retitling: Object.create(null),           // sessionId -> true while ✎ waits for the new title
  usageBusy: null,                          // { id, since, timer } while a ↻ refresh is in flight
  usageNote: null,                          // { text, until, warn } shown in the strip after a refresh
  noticeTimer: null,                        // hides the notice line again
  unarchiveWaiters: Object.create(null),    // sessionId -> callback for the unarchive reply (the browser copies after it)
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function fmtTokens(n) {
  if (n == null) return '—';
  if (n >= 1000) return (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k';
  return String(n);
}
function fmtAge(min) {
  if (min == null) return '';
  if (min < 1) return 'now';
  if (min < 60) return min + 'm';
  var h = Math.floor(min / 60);
  if (h < 24) return h + 'h';
  var d = Math.floor(h / 24);
  return d < 60 ? d + 'd' : Math.floor(d / 30) + 'mo';
}
function shortCwd(p) {
  if (!p) return '';
  var parts = String(p).split(/[\\/]/).filter(Boolean);
  return parts.length <= 2 ? p : parts.slice(-2).join('/');
}
function heading(s) {
  if (s.title) return { text: s.title, cls: 'title' };
  if (s.lastPrompt) return { text: s.lastPrompt.length > 70 ? s.lastPrompt.slice(0, 70) + '…' : s.lastPrompt, cls: 'title untitled' };
  return { text: s.name || s.sessionId, cls: 'title untitled' };
}
function markQuery(text, q) {
  var e = esc(text);
  if (!q) return e;
  var i = e.toLowerCase().indexOf(esc(q).toLowerCase());
  if (i === -1) return e;
  return e.slice(0, i) + '<mark>' + e.slice(i, i + esc(q).length) + '</mark>' + e.slice(i + esc(q).length);
}

// -- usage limits (top strip) ------------------------------------------------------------

function fmtReset(ms) {
  var diff = ms - Date.now();
  if (diff <= 0) return 'reset';
  var m = Math.round(diff / 60000);
  if (m < 60) return 'resets in ' + m + 'm';
  var h = Math.floor(m / 60);
  if (h < 24) return 'resets in ' + h + 'h ' + (m % 60) + 'm';
  var d = new Date(ms);
  var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  return 'resets ' + days[d.getDay()] + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
function fmtAgo(sec) {
  if (sec == null) return '';
  if (sec < 60) return 'just now';
  var m = Math.round(sec / 60);
  if (m < 60) return m + 'm ago';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

// Labels for records written before windows carried their own label.
var USAGE_LABELS = { five_hour: '5h', seven_day: '7d', seven_day_opus: '7d Opus', seven_day_sonnet: '7d Sonnet' };

function usageRow(label, pct, val, lvl) {
  return '<div class="u-win"><span class="lbl">' + esc(label) + '</span><div class="bar"><i class="' + lvl + '" style="width:' + pct + '%"></i></div><span class="val ' + lvl + '">' + val + '</span></div>';
}

/** The strip's note: a transient result message (throttled, failed) while it lasts, else the age. */
function usageNoteHtml(fallback) {
  var n = state.usageNote;
  if (n && n.until > Date.now()) return '<span class="u-msg' + (n.warn ? ' warn' : '') + '">' + esc(n.text) + '</span>';
  return '<span class="u-msg">' + esc(fallback) + '</span>';
}

/** The account the claude command is signed in with: the email in the head, org and plan on hover. */
function usageAccountHtml(a) {
  if (!a) return '';
  var text = a.email ? a.email : (a.loggedIn === false ? 'not logged in' : (/api.?key/i.test(a.authMethod || '') ? 'API key' : ''));
  if (!text) return '';
  var hint = [a.orgName, a.subscriptionType, a.authMethod].filter(Boolean).join(' · ');
  var what = 'the account the claude command is signed in with';
  return '<span class="u-acct" title="' + esc(hint ? hint + ' · ' + what : what) + '">' + esc(text) + '</span>';
}

function renderUsage(u) {
  var el = document.getElementById('usage');
  if (!u) { el.className = 'usage'; el.innerHTML = ''; return; }
  // The busy state lives in `state` (like pendingEnd), so the snapshot rerender every few
  // seconds cannot bring the button back while its refresh is still running.
  var refreshBtn = state.usageBusy
    ? '<button id="usageRefresh" class="spin" disabled title="refreshing…">↻</button>'
    : '<button id="usageRefresh" title="Refresh usage limits now">↻</button>';
  var head = '<div class="u-head"><b>Usage limits</b>' + (u.state === 'loading' ? '' : usageAccountHtml(u.account));
  var html;
  if (u.state === 'loading') {
    html = head + '<span>checking usage…</span></div>';
  } else if (u.state === 'no-limits') {
    html = head + '<span>no limits reported: not logged in, API key billing, or a plan without limits</span>'
      + '<span class="u-note">' + usageNoteHtml(fmtAgo(u.ageSeconds)) + ' ' + refreshBtn + '</span></div>';
  } else if (u.state === 'error') {
    html = head + '<span style="color:var(--warn)">' + esc(u.error || 'unavailable') + '</span><span class="u-note">' + usageNoteHtml('') + ' ' + refreshBtn + '</span></div>';
  } else {
    var note = fmtAgo(u.ageSeconds) + (u.subscriptionType ? ' · ' + u.subscriptionType : '');
    html = head + '<span class="u-note" title="' + esc(u.at ? new Date(u.at).toLocaleString() : '') + '">' + usageNoteHtml(note) + ' ' + refreshBtn + '</span></div>';
    var rows = '';
    Object.keys(u.windows || {}).forEach(function (k) {   // in the order the CLI listed them
      var w = u.windows[k];
      if (!w) return;
      var expired = Boolean(w.expired || (w.resetsAt && w.resetsAt <= Date.now()));
      var pct = expired || w.usedPct == null ? 0 : Math.max(0, Math.min(100, w.usedPct));
      var lvl = pct >= 90 ? 'crit' : pct >= 70 ? 'warn' : '';
      var val = expired ? 'window reset' : (w.usedPct == null ? '—' : Math.round(w.usedPct) + '% used');
      if (w.resetsAt && !expired) val += ' <span class="rs">· ' + esc(fmtReset(w.resetsAt)) + '</span>';
      rows += usageRow(w.label || USAGE_LABELS[k] || k, pct, val, lvl);
    });
    if (u.extraUsage && u.extraUsage.usedPct != null) {
      var xp = Math.max(0, Math.min(100, u.extraUsage.usedPct));
      rows += usageRow('extra', xp, Math.round(u.extraUsage.usedPct) + '% of extra usage', xp >= 90 ? 'crit' : xp >= 70 ? 'warn' : '');
    }
    if (rows) html += '<div class="u-rows">' + rows + '</div>';
    if (u.error) html += '<div class="u-stale">last refresh failed: ' + esc(u.error) + '</div>';
    else if (u.cacheError) html += '<div class="u-stale">numbers not cached: ' + esc(u.cacheError) + '</div>';
  }
  el.innerHTML = html;
  el.className = 'usage show';
  var btn = document.getElementById('usageRefresh');
  if (btn) btn.addEventListener('click', function (ev) { ev.stopPropagation(); startUsageRefresh(); });
}

var USAGE_WATCHDOG_MS = 45000;   // the probe times out at 30 s in core; this frees the button if no result ever arrives

function newRequestId() { return String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8); }

/*
 * ↻ lifecycle (both hosts):
 *   click → state.usageBusy = { id, since, timer } → render (spinning, disabled) → refreshUsage(id)
 *        ↘ watchdog(45 s): frees the button only if state.usageBusy still carries this id
 *   result { requestId, throttled, error } → onUsageResult: matches the id, clears the timer,
 *        sets a short note ("refreshed a moment ago" / "refresh failed: …"), rerenders.
 * A result for another id (a late answer, the command palette) never touches the busy state.
 */
function startUsageRefresh() {
  if (state.usageBusy) return;                        // one refresh at a time; extra clicks are ignored
  var id = newRequestId();
  var busy = { id: id, since: Date.now(), timer: null };
  busy.timer = setTimeout(function () {
    if (state.usageBusy && state.usageBusy.id === id) { state.usageBusy = null; render(); }
  }, USAGE_WATCHDOG_MS);
  state.usageBusy = busy;
  render();
  refreshUsage(id);
}

function refreshUsage(id) {
  if (vsapi) { send({ type: 'refreshUsage', requestId: id }); return; }
  api('POST', '/api/usage/refresh').then(function (res) {
    var b = res.body || {};
    if (b.state && state.data) state.data.usage = b;
    onUsageResult({ requestId: id, throttled: Boolean(b.throttled), error: b.error || (b.state ? null : ('server error ' + res.status)) });
  }).catch(function () { onUsageResult({ requestId: id, error: 'server not reachable' }); });
}

function onUsageResult(r) {
  var busy = state.usageBusy;
  if (!busy || !r || r.requestId !== busy.id) return;
  clearTimeout(busy.timer);
  state.usageBusy = null;
  var now = Date.now();
  if (r.error) state.usageNote = { text: 'refresh failed: ' + r.error, until: now + 6000, warn: true };
  else if (r.throttled) state.usageNote = { text: 'refreshed a moment ago', until: now + 3000 };
  else state.usageNote = null;
  if (state.usageNote) setTimeout(render, state.usageNote.until - now + 100);
  render();
}

// -- transport ------------------------------------------------------------------------

function send(msg) { if (vsapi) vsapi.postMessage(msg); }
function api(method, url, body) {
  return fetch(url, { method: method, cache: 'no-store', headers: { 'X-Board-Token': TOKEN, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; }); });
}

// -- rows --------------------------------------------------------------------------------

function actionsHtml(s, opts) {
  var pe = state.pendingEnd[s.sessionId];
  var flash = state.flashes[s.sessionId];
  var age = flash && flash.until > Date.now() ? flash.text : fmtAge(s.ageMinutes);
  var html = '<span class="age">' + esc(age) + '</span>';
  html += '<button class="iconbtn copy" title="copy: claude --resume …' + (boardArchived(s) ? ' (brings the transcript back first)' : '') + '" data-act="copy">⧉</button>';
  if (opts.endable || (opts.past && !s.live)) {
    html += state.retitling[s.sessionId]
      ? '<button class="iconbtn retitle" disabled title="asking for a title…">…</button>'
      : '<button class="iconbtn retitle" data-act="retitle" title="Rename in Claude Code: a model suggests a title from the progress so far, you confirm or edit it">✎</button>';
  }
  if (opts.endable) {
    var pm = state.pendingMute[s.sessionId];
    var dis = pm && pm.until > Date.now() ? ' disabled' : '';
    html += isMuted(s)
      ? '<button class="iconbtn unmute" data-act="unmute"' + dis + ' title="Unmute: notify and count this session again"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8a4 4 0 0 0-4 4v2.7L2.6 11h10.8L12 8.5V5.8a4 4 0 0 0-4-4zM6.4 12.6a1.6 1.6 0 0 0 3.2 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M2.2 2.2l11.6 11.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>'
      : '<button class="iconbtn mute" data-act="mute"' + dis + ' title="Mute: no notifications and no count for this session"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8a4 4 0 0 0-4 4v2.7L2.6 11h10.8L12 8.5V5.8a4 4 0 0 0-4-4zM6.4 12.6a1.6 1.6 0 0 0 3.2 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>';
  }
  if (boardArchived(s)) html += '<button class="iconbtn unarchive" data-act="unarchive" title="Unarchive: bring the transcript back and show this session on the board again">⤒</button>';
  if (opts.endable) {
    if (pe && pe.kind === 'pending') html += '<button class="iconbtn end" disabled title="' + (pe.archive ? 'archiving' : 'ending') + '">…</button>';
    else if (pe && pe.kind === 'confirming' && pe.until > Date.now()) {
      html += pe.archive
        ? '<button class="iconbtn confirm" data-act="archive" title="click again to end this session and keep it off the board">Archive?</button>'
        : '<button class="iconbtn confirm" data-act="end" title="click again to end this session and everything it started">End?</button>';
    } else {
      if (!s.archived) html += '<button class="iconbtn archive" data-act="archive" title="Archive: end this session and everything it started, and keep it off the board">⤓</button>';
      html += '<button class="iconbtn end" data-act="end" title="End this session and everything it started">✕</button>';
    }
  }
  return html;
}

/** "f8005c0d" from "Session f8005c0d", as Claude Code shows an id; any other query unchanged. */
function idQuery(q) {
  var m = /^\s*session\s+([0-9a-f][0-9a-f-]{3,35})\s*$/i.exec(String(q || ''));
  return m ? m[1] : String(q || '');
}

function fmtStarted(ms) {
  if (!ms) return null;
  var d = new Date(Number(ms));
  if (isNaN(d.getTime())) return null;
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

/** The folded-out details of a row: full id, start, process, window, transcript; id and path copy. */
function detailsHtml(s, opts) {
  if (!state.details[s.sessionId]) return '';
  var copy = function (v, what) { return '<button class="iconbtn copyval" data-act="copyval" data-copy="' + esc(v) + '" title="copy the ' + what + '">⧉</button>'; };
  var lines = ['<div><span class="k">id</span>' + esc(s.sessionId) + copy(s.sessionId, 'session id') + '</div>'];
  if (s.name && s.name !== String(s.sessionId).slice(0, 8)) lines.push('<div><span class="k">agent</span>' + esc(s.name) + copy(s.name, 'agent name') + '</div>');
  var started = fmtStarted(s.startedAt);
  var facts = [];
  if (started) facts.push('<span class="k">started</span>' + esc(started));
  if (!opts.past && s.pid) facts.push('<span class="k">pid</span>' + esc(s.pid));
  if (s.window) facts.push('<span class="k">window</span>' + esc(s.window.label || ('window ' + s.window.id)));
  if (s.kind && s.kind !== 'interactive') facts.push('<span class="k">kind</span>' + esc(s.kind));
  if (facts.length) lines.push('<div>' + facts.join(' · ') + '</div>');
  var file = s.transcriptPath || s.path || '';
  if (file) lines.push('<div title="' + esc(file) + '"><span class="k">transcript</span>' + esc(file) + copy(file, 'transcript path') + '</div>');
  return '<div class="details">' + lines.join('') + '</div>';
}

/** Put text on the clipboard: through the host in VS Code, the browser API otherwise. */
function copyText(sid, text) {
  if (vsapi) { send({ type: 'copyText', text: String(text).slice(0, 4096) }); flash(sid, 'copied', 'copied'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { flash(sid, 'copied', 'copied'); }, function () { window.prompt('Copy:', text); });
  } else window.prompt('Copy:', text);
}

function rowHtml(s, limits, opts) {
  opts = opts || {};
  var isLive = opts.past ? s.live : true;
  var cls = !isLive ? 'past' : s.status === 'waiting' ? 'waiting' : s.status === 'busy' ? 'busy' : s.unseen ? 'unseen' : 'idle';
  var pe = state.pendingEnd[s.sessionId];
  if (pe && pe.kind === 'pending') cls += ' ending';
  if (pe && pe.kind === 'error') cls += ' error';
  if (s.archived) cls += ' archived';
  if (!opts.past && isMuted(s)) cls += ' muted';
  var movable = isLive && !opts.past && canMove();   // manual mode and no filter: the handle shows only where a move can happen
  if (movable) cls += ' manual';
  var flash = state.flashes[s.sessionId];
  if (flash && flash.until > Date.now()) cls += ' ' + flash.cls;

  var statusText = !isLive ? '<span>past</span>'
    : s.status === 'waiting' ? '<span class="waitfor">' + esc(s.waitingFor || 'waiting') + '</span>'
    : s.unseen ? '<span title="the last answer ended and you have not opened the session since">unseen</span>'
    : '<span>' + esc(s.status) + '</span>';

  var ctx = '';
  if (!opts.past) {
    ctx = '<div class="ctx">' + fmtTokens(s.contextTokens);
    if (s.contextTokens != null && limits.compact) {
      var lvl = '';
      if (s.contextTokens >= limits.compact) lvl = 'crit';
      else if (limits.save && s.contextTokens >= limits.save) lvl = 'warn';
      ctx += ' <span style="color:var(--faint)">/ ' + fmtTokens(limits.compact) + '</span></div>'
        + '<div class="bar"><i class="' + lvl + '" style="width:' + (s.pct || 0) + '%"></i></div>';
    } else ctx += '</div>';
  } else {
    ctx = '<div class="ctx">' + (s.folder ? esc(s.folder) : '') + '</div>';
  }

  var h = heading(s);
  var chips = '';
  if (opts.past) chips += '<span class="chip' + (isLive ? ' live' : '') + '">' + (isLive ? 'live' : 'past') + '</span>';
  var by = archivedBy(s);
  if (by === 'claude-code') chips += '<span class="chip archived" title="archived in Claude Code\'s sidebar; unarchive it there">archived in Claude Code</span>';
  else if (by === 'both') chips += '<span class="chip archived" title="archived on the board and in Claude Code\'s sidebar; ⤒ clears the board\'s flag">archived here and in Claude Code</span>';
  else if (by === 'board') chips += '<span class="chip archived" title="archived on the board; ⤒ or a click brings it back">archived</span>';
  if (opts.past && s.window) chips += '<span class="chip" title="VS Code window ' + esc(s.window.id) + '">' + esc(s.window.label || ('window ' + s.window.id)) + '</span>';   // live rows sit in their window's section
  if (!opts.past && isMuted(s)) chips += '<span class="chip muted" title="muted: no notifications, not counted">muted</span>';
  var agent = s.name && s.name !== s.title && s.name !== String(s.sessionId).slice(0, 8) ? '<span class="agent" title="the agent name other Claude sessions use for this one">' + esc(s.name) + '</span>' : '';
  var sub = chips + agent + '<button class="sid" data-act="details" title="' + esc(s.sessionId) + ' (click for details)">Session ' + esc(String(s.sessionId).slice(0, 8)) + '</button>' + esc(shortCwd(s.cwd));   // one name per row: the heading; the agent name lives in the tooltip
  if (pe && pe.kind === 'error') sub = '<span style="color:var(--crit)">' + esc(pe.message || 'failed') + '</span> · ' + sub;

  var hint = !isLive ? 'click: resume this session (in this window when its folder is open here)'
    : s.window ? 'click: open this session in VS Code' + (s.unseen ? ' (marks it seen)' : '') : 'no VS Code window found; click copies: claude --resume ' + s.sessionId;
  if (movable) hint += '; Alt+Up or Alt+Down moves the row';

  var snips = '';
  if (opts.past && s.snippets && s.snippets.length) {
    snips = '<div class="snips">' + s.snippets.map(function (t) { return '<div>' + markQuery(t, opts.query) + '</div>'; }).join('') + '</div>';
  }

  return '<div class="row ' + cls + '" data-session="' + esc(s.sessionId) + '" data-live="' + (isLive ? '1' : '0') + '" data-archived="' + (s.archived ? '1' : '0') + '" data-board-archived="' + (boardArchived(s) ? '1' : '0') + '"'
    + ' data-haswindow="' + (s.window ? '1' : '0') + '" data-muted="' + (isMuted(s) ? '1' : '0') + '" data-path="' + esc(s.path || s.transcriptPath || '') + '" data-cwd="' + esc(s.cwd || '') + '"'
    + (opts.past ? '' : ' data-group="' + esc(groupKey(s)) + '" tabindex="0"')
    + ' title="' + esc(s.cwd) + (s.name ? '\n' + esc(s.name) : '') + '\n' + esc(hint) + '">'
    + (movable ? '<span class="handle" draggable="true" title="drag to reorder (Alt+Up or Alt+Down with the keyboard)" aria-hidden="true">⋮⋮</span>' : '')
    + '<div class="main"><div class="' + h.cls + '">' + (opts.past ? markQuery(h.text, opts.query) : esc(h.text)) + '</div><div class="sub">' + sub + '</div>' + detailsHtml(s, opts) + '</div>'
    + '<div class="status"><span class="dot"></span>' + statusText + '</div>'
    + '<div>' + ctx + '</div>'
    + '<div class="actions">' + actionsHtml(s, { endable: isLive && !opts.past, past: Boolean(opts.past) }) + '</div>'
    + snips
    + '</div>';
}

function flash(sessionId, text, cls) {
  state.flashes[sessionId] = { text: text, cls: cls, until: Date.now() + 1600 };
  render();
  setTimeout(render, 1700);
}

/** A line above the groups for outcomes that outlive their row (a move or restore that failed). */
function notice(text) {
  var el = document.getElementById('notice');
  document.getElementById('noticeText').textContent = text;
  el.className = 'notice show';
  clearTimeout(state.noticeTimer);
  state.noticeTimer = setTimeout(function () { el.className = 'notice'; }, 8000);
}

// Where a row's archive flag comes from: 'board', 'claude-code', 'both' or null. Rows from an
// older server carry only `archived`, which was always the board's.
function archivedBy(s) { return s.archivedBy || (s.archived ? 'board' : null); }
function boardArchived(s) { var by = archivedBy(s); return by === 'board' || by === 'both'; }

// -- actions -------------------------------------------------------------------------------

function copyResume(sid, note) {
  var cmd = 'claude --resume ' + sid;
  if (vsapi) { send({ type: 'copy', sessionId: sid }); flash(sid, note || 'copied', 'copied'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(cmd).then(function () { flash(sid, note || 'copied', 'copied'); }, function () { window.prompt('Copy:', cmd); });
  } else window.prompt('Copy:', cmd);
}

function markSeenHere(sid) {
  var live = rowById(sid);
  if (live && live.unseen) live.unseen = false;         // the host writes the marker; the next snapshot agrees
}

function openLive(el, sid) {
  markSeenHere(sid);
  if (el.getAttribute('data-haswindow') !== '1') {
    if (vsapi) send({ type: 'seen', sessionId: sid });
    else api('POST', '/api/seen/' + encodeURIComponent(sid)).catch(function () { /* the copy still happens */ });
    copyResume(sid, 'copied · no window');
    return;
  }
  flash(sid, 'opening…', 'jumped');
  if (vsapi) { send({ type: 'open', sessionId: sid }); return; }
  api('POST', '/api/focus/' + encodeURIComponent(sid)).then(function (res) {
    if (res.ok) flash(sid, '→ VS Code', 'jumped'); else copyResume(sid, 'copied · no jump');
  }).catch(function () { copyResume(sid, 'copied · server?'); });
}

/** A stowed transcript comes back before anything resumes it: the host does that itself, the browser asks first. */
function openPast(el, sid) {
  if (vsapi) { flash(sid, 'resuming…', 'jumped'); send({ type: 'openPast', sessionId: sid, path: el.getAttribute('data-path'), cwd: el.getAttribute('data-cwd') }); return; }
  if (el.getAttribute('data-board-archived') === '1') { requestUnarchive(sid, function (r) { if (r.ok) copyResume(sid, 'copied · resume in a terminal'); }); return; }
  copyResume(sid, 'copied · resume in a terminal');
}

/** ⧉: the same rule; the host brings a stowed transcript back on its own. */
function copyBack(el, sid) {
  if (!vsapi && el.getAttribute('data-board-archived') === '1') { requestUnarchive(sid, function (r) { if (r.ok) copyResume(sid); }); return; }
  copyResume(sid);
}

/*
 * ✕ and ⤓ share one two-step path:
 *   click ──▶ startConfirm: pendingEnd = { confirming, archive } for 3 s ("End?" / "Archive?")
 *   click again ──▶ requestEnd: pendingEnd = { pending, archive, pid } ──▶ host or POST /api/end[?archive=1]
 *   result ok ──▶ pendingEnd = { ended, pid }: the row is hidden until a snapshot drops the id or
 *                 shows it with another pid (a resume); archiveError ──▶ error state for 6 s
 *   needs-force ──▶ modal (host) or confirm() (browser), then the same request with force
 */
function startConfirm(sid, archive) {
  var pe = state.pendingEnd[sid];
  if (pe && pe.kind === 'confirming' && pe.until > Date.now() && Boolean(pe.archive) === Boolean(archive)) { requestEnd(sid, false, archive); return; }
  state.pendingEnd[sid] = { kind: 'confirming', archive: Boolean(archive), until: Date.now() + CONFIRM_MS };
  render();
  setTimeout(function () { var p = state.pendingEnd[sid]; if (p && p.kind === 'confirming' && p.until <= Date.now()) { delete state.pendingEnd[sid]; render(); } }, CONFIRM_MS + 50);
}

function requestEnd(sid, force, archive) {
  var row = rowById(sid);
  state.pendingEnd[sid] = { kind: 'pending', archive: Boolean(archive), pid: row ? row.pid : null };
  render();
  if (vsapi) { send({ type: 'end', sessionId: sid, force: Boolean(force), archive: Boolean(archive) }); return; }
  var qs = [force ? 'force=1' : '', archive ? 'archive=1' : ''].filter(Boolean).join('&');
  api('POST', '/api/end/' + encodeURIComponent(sid) + (qs ? '?' + qs : '')).then(function (res) {
    var b = res.body || {};
    if (res.ok && b.ok) { onEndResult({ sessionId: sid, ok: true, code: b.code, archived: Boolean(b.archived), archiveError: b.archiveError || null, moved: Boolean(b.moved), moveError: b.moveError || null }); return; }
    if (b.code === 'needs-force') {
      var name = (rowById(sid) || {}).title || sid.slice(0, 8);
      var question = archive ? '. Archive it? This ends it and everything it started; in-flight work is lost.' : '. End it and everything it started? In-flight work is lost.';
      if (window.confirm(name + ' is ' + (b.status || 'busy') + question)) { requestEnd(sid, true, archive); return; }
      onEndResult({ sessionId: sid, ok: false, code: 'cancelled', message: 'cancelled' });
      return;
    }
    onEndResult({ sessionId: sid, ok: false, code: b.code || ('http ' + res.status), message: b.message || b.error || '' });
  }).catch(function () { onEndResult({ sessionId: sid, ok: false, code: 'server', message: 'server not reachable' }); });
}

function endError(sid, message) {
  state.pendingEnd[sid] = { kind: 'error', message: message };
  render();
  setTimeout(function () { if (state.pendingEnd[sid] && state.pendingEnd[sid].kind === 'error') { delete state.pendingEnd[sid]; render(); } }, 6000);
}

function onEndResult(r) {
  var pe = state.pendingEnd[r.sessionId] || {};
  if (r.ok && r.archived && r.moveError) notice('archived; transcript not moved: ' + r.moveError);   // the row still leaves; Claude Code keeps listing the session
  if (r.ok && r.archiveError) { endError(r.sessionId, 'ended, not archived: ' + r.archiveError); return; }   // the process is gone; the row leaves with the next snapshot
  if (r.ok) { state.pendingEnd[r.sessionId] = { kind: 'ended', pid: pe.pid != null ? pe.pid : null }; flash(r.sessionId, r.archived ? 'archived' : 'ended', 'copied'); }
  else if (r.code === 'cancelled') { delete state.pendingEnd[r.sessionId]; render(); }
  else endError(r.sessionId, r.message || r.code);
}

/*
 * ⤒, a click on a live archived row, or (in the browser) a click or ⧉ on an archived past row:
 * the host or server brings the transcript back and drops the board's flag. `done(r)` runs
 * on the reply, so the browser copies a resume command only once the file is back.
 */
function requestUnarchive(sid, done) {
  if (done) state.unarchiveWaiters[sid] = done;
  if (vsapi) { send({ type: 'unarchive', sessionId: sid }); return; }
  api('POST', '/api/unarchive/' + encodeURIComponent(sid)).then(function (res) {
    var b = res.body || {};
    onUnarchiveResult({ sessionId: sid, ok: Boolean(res.ok && b.ok), restoredTo: b.restoredTo || null, message: b.error || b.message || ('http ' + res.status) });
  }).catch(function () { onUnarchiveResult({ sessionId: sid, ok: false, message: 'server not reachable' }); });
}

/** The board's flag is gone (Claude Code's may remain) and the transcript is back at `restoredTo`. */
function applyRestore(sid, restoredTo) {
  var update = function (s) {
    var by = archivedBy(s);
    s.archivedBy = by === 'both' || by === 'claude-code' ? 'claude-code' : null;
    s.archived = s.archivedBy !== null;
    if (restoredTo) s.path = restoredTo;
  };
  var live = rowById(sid);
  if (live) update(live);                                // the next snapshot says the same
  var rows = (state.search && state.search.result && state.search.result.rows) || [];
  rows.forEach(function (s) { if (s.sessionId === sid) update(s); });
}

function onUnarchiveResult(r) {
  var done = state.unarchiveWaiters[r.sessionId];
  delete state.unarchiveWaiters[r.sessionId];
  if (!r.ok) {
    notice('unarchive failed: ' + (r.message || ''));
    flash(r.sessionId, 'unarchive failed', 'error');
    if (done) done(r);
    return;
  }
  applyRestore(r.sessionId, r.restoredTo || null);
  flash(r.sessionId, 'unarchived', 'copied');
  if (done) done(r);
}

/*
 * ✎: click ──▶ state.retitling[sid] = true (button disabled, "…")
 *    VS Code: the host suggests, asks, writes or hands over to Claude's rename box ──▶ retitleResult
 *    browser: POST /api/title/suggest/<id> ──▶ prompt() prefilled ──▶ POST /api/title/<id>?title=
 *    result ok ──▶ the row shows the title at once; the next snapshot reads it from Claude's files
 *    code cancelled ──▶ nothing; code claude-owned (browser) ──▶ the suggestion is copied, the notice says why
 *    result not ok ──▶ the message on the row for 6 s, like a failed end
 */
/** A row of the current search result, or undefined. */
function searchRow(sid) { return ((state.search && state.search.result && state.search.result.rows) || []).filter(function (x) { return x.sessionId === sid; })[0]; }

function requestRetitle(sid) {
  if (state.retitling[sid]) return;
  state.retitling[sid] = true;
  render();
  if (vsapi) { send({ type: 'retitle', sessionId: sid }); return; }
  var fail = function (message) { onRetitleResult({ sessionId: sid, ok: false, title: null, message: message }); };
  api('POST', '/api/title/suggest/' + encodeURIComponent(sid)).then(function (res) {
    var b = res.body || {};
    var current = rowById(sid) || searchRow(sid) || {};
    var proposal = res.ok && b.ok ? b.title : (current.title || '');
    var typed = window.prompt('Session title' + (res.ok && b.ok ? '' : ' (no suggestion: ' + (b.message || b.error || ('http ' + res.status)) + ')'), proposal);
    if (typed === null || !typed.trim()) { onRetitleResult({ sessionId: sid, ok: false, code: 'cancelled' }); return; }
    return api('POST', '/api/title/' + encodeURIComponent(sid) + '?title=' + encodeURIComponent(typed.trim().slice(0, 200))).then(function (w) {
      var wb = w.body || {};
      if (w.status === 409) {
        copyText(sid, typed.trim());
        delete state.retitling[sid];
        notice('rename it in Claude Code: the session is running and its CLI would write its own name back (the title is on the clipboard)');
        render();
        return;
      }
      onRetitleResult({ sessionId: sid, ok: Boolean(w.ok && wb.ok), title: wb.title || null, message: wb.message || wb.error || ('http ' + w.status) });
    });
  }).catch(function () { fail('server not reachable'); });
}

function onRetitleResult(r) {
  delete state.retitling[r.sessionId];
  if (r.code === 'cancelled') { render(); return; }
  if (r.code === 'handed') { render(); flash(r.sessionId, 'in Claude', 'copied'); return; }
  if (!r.ok) { endError(r.sessionId, 'rename failed: ' + (r.message || 'unknown')); return; }
  var target = rowById(r.sessionId) || searchRow(r.sessionId);
  if (target && r.title) target.title = r.title;
  flash(r.sessionId, 'renamed', 'copied');
}

/*
 * The bell: click ──▶ state.pendingMute[sid] = { muted, until: now + 10 s } ──▶ render: the row shows
 *    the new flag at once and its bell is disabled ──▶ host or POST /api/mute|unmute/<id>
 *    result ok ──▶ the row keeps its flag; the entry stays until a snapshot agrees or the 10 s pass
 *    result not ok ──▶ the entry goes, the flag returns, the notice line says why
 */
function requestMute(sid, muted) {
  var pm = state.pendingMute[sid];
  if (pm && pm.until > Date.now()) return;                 // one request at a time; a second click is ignored
  state.pendingMute[sid] = { muted: Boolean(muted), until: Date.now() + MUTE_PENDING_MS };
  render();
  setTimeout(render, MUTE_PENDING_MS + 50);               // the guard's expiry needs a repaint
  if (vsapi) { send({ type: muted ? 'mute' : 'unmute', sessionId: sid }); return; }
  api('POST', '/api/' + (muted ? 'mute' : 'unmute') + '/' + encodeURIComponent(sid)).then(function (res) {
    var b = res.body || {};
    onMuteResult({ sessionId: sid, ok: Boolean(res.ok && b.ok), muted: Boolean(muted), message: b.error || b.message || ('http ' + res.status) });
  }).catch(function () { onMuteResult({ sessionId: sid, ok: false, muted: Boolean(muted), message: 'server not reachable' }); });
}

function onMuteResult(r) {
  if (!r.ok) {
    delete state.pendingMute[r.sessionId];
    notice((r.muted ? 'mute' : 'unmute') + ' failed: ' + (r.message || 'unknown'));
    render();
    return;
  }
  var live = rowById(r.sessionId);
  if (live) live.muted = Boolean(r.muted);                 // the next snapshot carries the same flag
  flash(r.sessionId, r.muted ? 'muted' : 'unmuted', 'copied');
}

/*
 * The order switch: click ──▶ state.pendingMode = { mode, until: now + 10 s } ──▶ render at once ──▶ host or POST /api/order/mode?mode=
 *    result ok ──▶ the entry stays until a snapshot agrees or the 10 s pass; result not ok ──▶ the entry goes, the notice line says why
 */
function applyMode(mode) {
  if ((mode !== 'manual' && mode !== 'activity') || mode === currentMode()) return;
  state.pendingMode = { mode: mode, until: Date.now() + ORDER_PENDING_MS };
  render();
  setTimeout(render, ORDER_PENDING_MS + 50);              // the guard's expiry needs a repaint
  if (vsapi) { send({ type: 'sortMode', mode: mode }); return; }
  api('POST', '/api/order/mode?mode=' + encodeURIComponent(mode)).then(function (res) {
    var b = res.body || {};
    onSortModeResult({ ok: Boolean(res.ok && b.ok), mode: mode, message: b.error || b.message || ('http ' + res.status) });
  }).catch(function () { onSortModeResult({ ok: false, mode: mode, message: 'server not reachable' }); });
}

function onSortModeResult(r) {
  if (r.ok) return;                                        // the next snapshot carries the mode and drops the pending entry
  state.pendingMode = null;
  notice('order mode failed: ' + (r.message || 'unknown'));
  render();
}

/** The switch in the header: hidden until a snapshot carries `order` (an older server has none); the pressed button is the current mode. */
function renderSwitch(data) {
  var el = document.getElementById('sortMode');
  var has = Boolean(data && data.order);
  el.style.display = has ? '' : 'none';
  var mode = has ? currentMode() : 'activity';
  Array.prototype.forEach.call(el.querySelectorAll('button[data-mode]'), function (b) {
    var on = b.getAttribute('data-mode') === mode;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.classList.toggle('on', on);
  });
}

/*
 * A move: a handle drag or Alt+Up/Down ──▶ applyOrder(key, ids): state.pendingOrder[key] = { ids, until: now + 10 s }
 *    ──▶ render at once (rankOf answers from the pending list) ──▶ host or POST /api/order?ids=
 *    result ok ──▶ the entry stays until a snapshot agrees (every rank equals its index) or the 10 s pass
 *    result not ok ──▶ the entry goes, the rows return, the notice line says why
 * The list is the whole group, every row in its new order. Manual mode only, and never under a typed filter
 * (the list must be the whole group).
 */
function canMove() { return currentMode() === 'manual' && !state.filter; }

/** The ids of a group in display order, or null for an unknown group. */
function groupLists(key) {
  var g = groupSessions((state.data && state.data.sessions) || [], state.data ? state.data.thisWindowId : null);
  var ids = function (list) { return list.map(function (s) { return s.sessionId; }); };
  for (var i = 0; i < g.sections.length; i++) {
    var sec = g.sections[i];
    if (sec.key === key) return ids(sec.rows);
  }
  return null;
}

function applyOrder(key, ids) {
  if (!canMove() || ids.length < 2) return false;
  if (ids.join(',').length > ORDER_QUERY_MAX) { notice('too many rows to reorder'); return false; }
  state.pendingOrder[key] = { ids: ids, until: Date.now() + ORDER_PENDING_MS };
  render();
  setTimeout(render, ORDER_PENDING_MS + 50);              // the guard's expiry needs a repaint
  if (vsapi) { send({ type: 'order', ids: ids }); return true; }
  api('POST', '/api/order?ids=' + ids.map(encodeURIComponent).join(',')).then(function (res) {
    var b = res.body || {};
    onOrderResult({ ok: Boolean(res.ok && b.ok), key: key, message: b.error || b.message || ('http ' + res.status) });
  }).catch(function () { onOrderResult({ ok: false, key: key, message: 'server not reachable' }); });
  return true;
}

function onOrderResult(r) {
  if (r.ok) return;                                        // the next snapshot carries the ranks and drops the pending entry
  if (r.key) delete state.pendingOrder[r.key]; else state.pendingOrder = Object.create(null);   // the host's reply names no group
  notice('reorder failed: ' + (r.message || 'unknown'));
  render();
}

function groupKeyOf(sid) { var s = rowById(sid); return s ? groupKey(s) : null; }

/** Put `sid` before or after `targetSid` inside their shared group (a drop); the whole group's order is sent. */
function applyDrop(sid, targetSid, before) {
  var key = groupKeyOf(sid);
  if (!key || sid === targetSid || key !== groupKeyOf(targetSid)) return false;
  var list = groupLists(key);
  if (!list) return false;
  var shown = list.filter(function (id) { return id !== sid; });
  var at = shown.indexOf(targetSid);
  if (at === -1) return false;
  shown.splice(before ? at : at + 1, 0, sid);
  return applyOrder(key, shown);
}

/** Alt+Up / Alt+Down: swap the row with its neighbour in its group; the ends are no-ops. */
function moveByOne(sid, delta) {
  var key = groupKeyOf(sid);
  var list = key ? groupLists(key) : null;
  if (!list) return false;
  var shown = list.slice();
  var i = shown.indexOf(sid), j = i + delta;
  if (i === -1 || j < 0 || j >= shown.length) return false;
  shown[i] = shown[j]; shown[j] = sid;
  return applyOrder(key, shown);
}

function refocus(sid) { var el = document.querySelector('.row[data-session="' + sid + '"]'); if (el && el.focus) el.focus(); }

function clearDropMarks() {
  Array.prototype.forEach.call(document.querySelectorAll('.row.drop-before, .row.drop-after'), function (r) { r.classList.remove('drop-before', 'drop-after'); });
}

function endDrag() {
  if (!state.drag) return;
  state.drag = null;
  clearDropMarks();
  Array.prototype.forEach.call(document.querySelectorAll('.row.dragging'), function (r) { r.classList.remove('dragging'); });
  if (state.renderDue) { state.renderDue = false; render(); }
}

function rowById(sid) {
  var all = (state.data && state.data.sessions) || [];
  for (var i = 0; i < all.length; i++) if (all[i].sessionId === sid) return all[i];
  return null;
}

function onRowClick(ev) {
  var ctl = ev.target.closest ? ev.target.closest('button[data-act="fold"], button[data-act="archived"], button[data-act="mode"], button[data-act="clearfilter"]') : null;
  if (ctl) {                                               // section controls live outside the rows
    ev.stopPropagation();
    var key = ctl.getAttribute('data-section');
    var ctlAct = ctl.getAttribute('data-act');
    if (ctlAct === 'mode') { applyMode(ctl.getAttribute('data-mode')); return; }
    if (ctlAct === 'clearfilter') { clearSearch(); return; }
    if (ctlAct === 'fold') state.folded[key] = !isFolded(key);
    else state.showArchived = !state.showArchived;
    render();
    return;
  }
  var el = ev.target.closest ? ev.target.closest('.row[data-session]') : null;
  if (!el) return;
  var sid = el.getAttribute('data-session');
  var btn = ev.target.closest ? ev.target.closest('button[data-act]') : null;
  if (btn) {
    ev.stopPropagation();
    var act = btn.getAttribute('data-act');
    if (act === 'copy') { copyBack(el, sid); return; }
    if (act === 'details') { state.details[sid] = !state.details[sid]; render(); return; }
    if (act === 'copyval') { copyText(sid, btn.getAttribute('data-copy') || ''); return; }
    if (act === 'unarchive') { requestUnarchive(sid); return; }
    if (act === 'retitle') { requestRetitle(sid); return; }
    if (act === 'mute' || act === 'unmute') { requestMute(sid, act === 'mute'); return; }
    if (act === 'end' || act === 'archive') { startConfirm(sid, act === 'archive'); return; }
    return;
  }
  if (el.getAttribute('data-live') === '1') {
    if (el.getAttribute('data-board-archived') === '1') requestUnarchive(sid);   // an explicit open brings a live archived session back
    openLive(el, sid);
  } else openPast(el, sid);                                                        // a past row: the host restores inside openPast
}

// -- search -------------------------------------------------------------------------------

function startSearch() {
  var q = document.getElementById('q').value.trim();
  var content = true;                       // Enter always searches transcript text as well
  if (!q) { clearSearch(); return; }
  var requestId = newRequestId();
  state.search = { requestId: requestId, query: q, content: content, pending: true, result: null };
  render();
  if (vsapi) { send({ type: 'search', query: q, content: content, requestId: requestId }); return; }
  api('GET', '/api/search?q=' + encodeURIComponent(q) + '&content=' + (content ? '1' : '0') + '&requestId=' + encodeURIComponent(requestId))
    .then(function (res) { onSearchResult(res.ok ? res.body : { requestId: requestId, query: q, content: content, total: 0, shown: 0, partial: true, partialReason: (res.body && (res.body.error || res.body.message)) || ('http ' + res.status), rows: [] }); })
    .catch(function () { onSearchResult({ requestId: requestId, query: q, content: content, total: 0, shown: 0, partial: true, partialReason: 'server not reachable', rows: [] }); });
}
function onSearchResult(r) {
  if (!state.search || !r || r.requestId !== state.search.requestId) return;   // superseded or cleared
  state.search.pending = false;
  state.search.result = r;
  render();
}
function clearSearch() {
  if (state.search && state.search.pending) send({ type: 'cancelSearch', requestId: state.search.requestId });
  state.search = null;
  state.filter = '';
  document.getElementById('q').value = '';
  render();
}

// -- render -------------------------------------------------------------------------------

function matchesFilter(s) {
  if (!state.filter) return true;
  var f = idQuery(state.filter).toLowerCase();
  return [s.title, s.lastPrompt, s.name, s.cwd, s.sessionId].some(function (v) { return typeof v === 'string' && v.toLowerCase().indexOf(f) !== -1; });
}

// -- sections ---------------------------------------------------------------------------

function putAway(s) { return Boolean(s.archived) && s.status !== 'waiting'; }   // an archived session is put away until it needs you
function byAge(a, b) { return (a.ageMinutes == null ? 1e9 : a.ageMinutes) - (b.ageMinutes == null ? 1e9 : b.ageMinutes); }
function statusRank(s) { return s.status === 'waiting' ? 0 : s.status === 'busy' ? 1 : s.unseen ? 2 : 3; }
function sectionKey(s) { return s.window ? 'w' + s.window.id : 'none'; }
function sectionLabel(s) { return s.window ? (s.window.label || ('window ' + s.window.id)) : 'Elsewhere'; }
/** The row's mute flag as the page shows it: a fresh click on the bell wins over the last snapshot. */
function isMuted(s) { var p = state.pendingMute[s.sessionId]; return p && p.until > Date.now() ? p.muted : Boolean(s.muted); }

/*
 * Sections: one per VS Code window, "Elsewhere" for rows without one, and the archived rows that
 * are put away. Precedence per row: an ended row is dropped, archived-and-not-waiting goes to
 * Archived, the rest to its window, muted or not (a muted row keeps its place and its colour).
 * A typed filter shows archived matches in place. The badge of a section counts its rows that
 * wait or are unseen, muted rows left out. Order: this window first, then by waiting rows,
 * unseen rows and label; Elsewhere last.
 */
/** The order the switch chose: a pending switch wins over the snapshot; an older server without `order` means activity. */
function currentMode() {
  var p = state.pendingMode;
  if (p && p.until > Date.now()) return p.mode;
  return state.data && state.data.order && state.data.order.mode === 'manual' ? 'manual' : 'activity';
}
function groupKey(s) { return sectionKey(s); }
/** The row's rank as the page sorts it: a pending move of its group wins over the snapshot; null means unranked (on top). */
function rankOf(s) {
  var po = state.pendingOrder[groupKey(s)];
  if (po && po.until > Date.now()) { var i = po.ids.indexOf(s.sessionId); if (i !== -1) return i; }
  return typeof s.rank === 'number' && isFinite(s.rank) ? s.rank : null;
}
function rowOrder(a, b) {
  if (currentMode() !== 'manual') return statusRank(a) - statusRank(b) || byAge(a, b);
  var ra = rankOf(a), rb = rankOf(b);
  if ((ra === null) !== (rb === null)) return ra === null ? -1 : 1;   // a row without a place sits on top
  return (ra === null ? 0 : ra - rb) || byAge(a, b);
}

function groupSessions(rows, thisWindowId) {
  var filter = Boolean(state.filter);
  var byKey = Object.create(null), archived = [];
  var add = function (s) {
    var key = sectionKey(s);
    if (!byKey[key]) byKey[key] = { key: key, label: sectionLabel(s), thisWindow: thisWindowId != null && Boolean(s.window) && s.window.id === thisWindowId, rows: [] };
    byKey[key].rows.push(s);
  };
  rows.forEach(function (s) {
    if (!matchesFilter(s)) return;
    var pe = state.pendingEnd[s.sessionId];
    if (pe && pe.kind === 'ended') return;
    if (putAway(s) && !filter) { archived.push(s); return; }
    add(s);
  });
  var counts = function (list) {
    list = list.filter(function (s) { return !isMuted(s); });   // a muted row counts nowhere
    var waiting = list.filter(function (s) { return s.status === 'waiting'; }).length;
    var unseen = list.filter(function (s) { return s.status !== 'waiting' && s.status !== 'busy' && s.unseen; }).length;
    return { waiting: waiting, unseen: unseen, badge: waiting + unseen };
  };
  var finish = function (sec) {
    sec.rows.sort(rowOrder);
    Object.assign(sec, counts(sec.rows));
    return sec;
  };
  var sections = Object.keys(byKey).map(function (k) { return finish(byKey[k]); }).sort(function (a, b) {
    if (a.thisWindow !== b.thisWindow) return a.thisWindow ? -1 : 1;
    if ((a.key === 'none') !== (b.key === 'none')) return a.key === 'none' ? 1 : -1;
    return (b.waiting - a.waiting) || (b.unseen - a.unseen) || a.label.localeCompare(b.label);
  });
  archived.sort(byAge);
  return { sections: sections, archived: archived };
}

/** Fold state is memory only: a window section starts open. */
function isFolded(key) { return Boolean(state.folded[key]); }

function badgeHtml(sec) {
  if (!sec.badge) return '';
  var hint = [sec.waiting ? sec.waiting + ' need' + (sec.waiting === 1 ? 's' : '') + ' you' : '', sec.unseen ? sec.unseen + ' unseen' : ''].filter(Boolean).join(', ');
  return '<span class="badge ' + (sec.waiting ? 'wait' : 'unseen') + '" title="' + esc(hint) + '">' + sec.badge + '</span>';
}

/** The head of a section: a button that folds the body, with the label, the badge and the row count. */
function sectionHead(sec, label, count, thisWindow) {
  var tag = 'h2';
  var folded = isFolded(sec.key) && !state.filter;   // a filter shows every match, folded or not
  return '<' + tag + ' class="section-head"><button class="fold" data-act="fold" data-section="' + esc(sec.key) + '" aria-expanded="' + (folded ? 'false' : 'true') + '" title="' + (folded ? 'unfold' : 'fold') + '">'
    + '<span class="caret">' + (folded ? '▸' : '▾') + '</span><span class="label">' + esc(label) + '</span>'
    + (thisWindow ? '<span class="chip here" title="the VS Code window this board runs in">this window</span>' : '')
    + badgeHtml(sec) + '<span class="n">' + count + '</span></button></' + tag + '>';
}

function sectionHtml(sec, limits) {
  var folded = isFolded(sec.key) && !state.filter;
  var cls = 'group section' + (folded ? ' folded' : '') + (sec.waiting ? ' waiting' : sec.unseen ? ' unseen' : '') + (sec.thisWindow ? ' here' : '');
  var body = sec.rows.map(function (s) { return rowHtml(s, limits); }).join('');   // every running row that is not archived, idle or not
  return '<div class="' + cls + '" data-section="' + esc(sec.key) + '">' + sectionHead(sec, sec.label, sec.rows.length, sec.thisWindow) + '<div class="section-body">' + body + '</div></div>';
}

function render() {
  if (state.drag) { state.renderDue = true; return; }     // never replace the DOM under a drag; dragend renders
  var data = state.data;
  var limits = (data && data.limits) || { compact: null, save: null };
  var all = (data && data.sessions) || [];

  // a typed filter hides rows; say so, with the count and a way out
  var fl = document.getElementById('filterline');
  if (state.filter) {
    var matched = all.filter(function (s) { var pe = state.pendingEnd[s.sessionId]; return matchesFilter(s) && !(pe && pe.kind === 'ended'); }).length;
    fl.innerHTML = 'Filter “' + esc(state.filter) + '”: ' + matched + ' of ' + all.length + ' running session' + (all.length === 1 ? '' : 's')
      + '<button data-act="clearfilter" title="clear the filter (Esc)">clear</button>';
    fl.style.display = '';
  } else { fl.style.display = 'none'; fl.innerHTML = ''; }

  // search results block
  var gr = document.getElementById('g-results');
  if (state.search) {
    gr.style.display = '';
    var r = state.search.result;
    var head = 'Search results';
    if (state.search.pending) head += ' · searching…';
    else if (r) head += ' (' + r.shown + (r.total !== r.shown ? ' of ' + r.total : '') + ')';
    document.getElementById('h-results').textContent = head;
    var html = '';
    if (r) {
      if (r.partial) html += '<div class="empty" style="color:var(--warn)">Partial results: ' + esc(r.partialReason || 'some transcripts could not be searched') + (r.skipped ? ' · ' + r.skipped + ' unmatched files skipped' : '') + '</div>';
      if (r.content && r.rgAvailable === false) html += '<div class="empty" style="color:var(--warn)">ripgrep (rg) not found; title search only.</div>';
      html += r.rows.length ? r.rows.map(function (s) { return rowHtml(s, limits, { past: true, query: r.query }); }).join('') : '<div class="empty">No session matches “' + esc(r.query) + '”.</div>';
    }
    document.getElementById('l-results').innerHTML = html;
  } else gr.style.display = 'none';

  // Muted sessions count nowhere.
  var g = groupSessions(all, data ? data.thisWindowId : null);
  var counted = all.filter(function (s) { return !isMuted(s); });
  var allWaiting = counted.filter(function (s) { return s.status === 'waiting'; });
  var visible = counted.filter(function (s) { return !putAway(s); });
  var isIdle = function (s) { return s.status !== 'waiting' && s.status !== 'busy'; };
  var unseenCount = visible.filter(function (s) { return isIdle(s) && s.unseen; }).length;
  document.getElementById('counts').innerHTML = '<b>' + allWaiting.length + '</b> need you · <b>' + visible.filter(function (s) { return s.status === 'busy'; }).length + '</b> working · '
    + (unseenCount ? '<b>' + unseenCount + '</b> unseen · ' : '') + '<b>' + visible.filter(function (s) { return isIdle(s) && !s.unseen; }).length + '</b> idle';
  document.title = (allWaiting.length ? '(' + allWaiting.length + ') ' : '') + 'Sessions';

  var banner = document.getElementById('banner');
  if (data && data.stale) { banner.className = 'banner show'; banner.textContent = 'Showing last known data: ' + (data.error || 'could not reach the claude CLI'); }
  else banner.className = 'banner';

  renderUsage(data ? data.usage : null);
  renderSwitch(data);

  var emptyText = state.filter ? 'No live session matches.' : 'No live sessions.';
  document.getElementById('sections').innerHTML = g.sections.length ? g.sections.map(function (sec) { return sectionHtml(sec, limits); }).join('') : '<div class="group"><div class="empty">' + emptyText + '</div></div>';

  var archived = g.archived;
  var archivedHtml = '';
  if (archived.length) {
    if (state.showArchived) archivedHtml += archived.map(function (s) { return rowHtml(s, limits); }).join('');
    archivedHtml += '<div class="empty"><button id="toggleArchived" data-act="archived">' + (state.showArchived ? 'Hide' : 'Show') + ' ' + archived.length + ' archived</button></div>';
  }
  document.getElementById('g-archived').style.display = archived.length ? '' : 'none';
  document.getElementById('l-archived').innerHTML = archivedHtml;
}

function onSnapshot(data) {
  state.data = data;
  // ended rows drop out once the snapshot no longer lists them, or lists them with another
  // process (a resume): from then on the archived flag alone decides what is shown
  Object.keys(state.pendingEnd).forEach(function (sid) {
    var pe = state.pendingEnd[sid];
    if (pe.kind !== 'ended') return;
    var row = (data.sessions || []).filter(function (s) { return s.sessionId === sid; })[0];
    if (!row || (pe.pid != null && row.pid !== pe.pid)) delete state.pendingEnd[sid];
  });
  // a move holds its group's order until a snapshot agrees (every rank equals its index), or the guard expires
  Object.keys(state.pendingOrder).forEach(function (key) {
    var po = state.pendingOrder[key];
    var agrees = po.ids.every(function (id, i) { var s = (data.sessions || []).filter(function (x) { return x.sessionId === id; })[0]; return s && s.rank === i; });
    if (agrees || po.until <= Date.now()) delete state.pendingOrder[key];
  });
  // the switch holds its mode until a snapshot agrees, or the guard expires
  var pm = state.pendingMode;
  if (pm && ((data.order && data.order.mode === pm.mode) || pm.until <= Date.now())) state.pendingMode = null;
  // a click on the bell holds its flag until a snapshot agrees with it, or the guard expires
  Object.keys(state.pendingMute).forEach(function (sid) {
    var pm = state.pendingMute[sid];
    var live = (data.sessions || []).filter(function (s) { return s.sessionId === sid; })[0];
    if (!live || Boolean(live.muted) === pm.muted || pm.until <= Date.now()) delete state.pendingMute[sid];
  });
  render();
  notifyFresh(data.sessions || []);
}

/**
 * Browser front end only (VS Code has its own toasts): a Notification for a row that starts
 * waiting and for a known row whose answer ended (its unseenAt moved). Muted rows are tracked,
 * never announced, so unmuting raises nothing either; nothing on the first snapshot.
 */
function notifyFresh(rows) {
  var waitingNow = Object.create(null), unseenNow = Object.create(null), known = Object.create(null), fresh = [];
  rows.forEach(function (s) {
    known[s.sessionId] = true;
    if (s.status === 'waiting') {
      waitingNow[s.sessionId] = true;
      if (!state.prevWaiting[s.sessionId] && !isMuted(s)) fresh.push({ s: s, title: (s.title || s.name) + ' needs you', body: (s.waitingFor || 'waiting') + ' · ' + shortCwd(s.cwd) });
    }
    var u = Number(s.unseenAt) || 0;
    var before = state.prevUnseenAt[s.sessionId] || 0;
    if (u) {
      if (state.known[s.sessionId] && u > before && s.unseen && !isMuted(s)) fresh.push({ s: s, title: (s.title || s.name) + ' is done', body: shortCwd(s.cwd) });
      unseenNow[s.sessionId] = Math.max(u, before);
    } else if (before) unseenNow[s.sessionId] = before;
  });
  if (!vsapi && !state.firstLoad && fresh.length && window.Notification && Notification.permission === 'granted') {
    fresh.forEach(function (f) {
      try { new Notification(f.title, { body: f.body, tag: 'cc-' + f.s.sessionId }); } catch (e) { /* unavailable */ }
    });
  }
  state.prevWaiting = waitingNow;
  state.prevUnseenAt = unseenNow;
  state.known = known;
  state.firstLoad = false;
}

// -- wiring ------------------------------------------------------------------------------

document.addEventListener('click', onRowClick);
var qEl = document.getElementById('q');
qEl.addEventListener('input', function () {
  state.filter = qEl.value.trim();
  if (!state.filter && state.search) { clearSearch(); return; }   // an emptied box drops the results too
  render();
});
qEl.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter') { ev.preventDefault(); startSearch(); }
  if (ev.key === 'Escape') { ev.preventDefault(); clearSearch(); }
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && state.search) clearSearch(); });

// Alt+Up / Alt+Down on a focused row moves it; the row keeps the focus across the re-render.
document.addEventListener('keydown', function (ev) {
  if (!ev.altKey || (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown')) return;
  var row = document.activeElement && document.activeElement.closest ? document.activeElement.closest('.row[data-session]') : null;
  if (!row || !canMove()) return;
  ev.preventDefault();
  var sid = row.getAttribute('data-session');
  if (moveByOne(sid, ev.key === 'ArrowUp' ? -1 : 1)) refocus(sid);
});

// The handle is the only draggable element; a drop lands on a row of the same group (data-group), anywhere else is refused.
document.addEventListener('dragstart', function (ev) {
  var h = ev.target.closest ? ev.target.closest('.handle') : null;
  var row = h ? h.closest('.row[data-session]') : null;
  if (!row || !canMove()) { if (h) ev.preventDefault(); return; }
  state.drag = { sid: row.getAttribute('data-session'), key: row.getAttribute('data-group'), over: null };
  try { ev.dataTransfer.setData('text/plain', state.drag.sid); ev.dataTransfer.effectAllowed = 'move'; } catch (_) { /* no dataTransfer on a synthetic event */ }
  row.classList.add('dragging');
});
document.addEventListener('dragover', function (ev) {
  var d = state.drag;
  if (!d) return;
  var row = ev.target.closest ? ev.target.closest('.row[data-session]') : null;
  if (!row || row.getAttribute('data-group') !== d.key) return;   // no preventDefault: the drop is refused here
  ev.preventDefault();
  if (ev.dataTransfer) { try { ev.dataTransfer.dropEffect = 'move'; } catch (_) { /* read-only on some events */ } }
  var rect = row.getBoundingClientRect();
  var before = ev.clientY < rect.top + rect.height / 2;
  var sid = row.getAttribute('data-session');
  if (d.over && d.over.sid === sid && d.over.before === before) return;   // nothing changed: no DOM work
  clearDropMarks();
  if (sid !== d.sid) row.classList.add(before ? 'drop-before' : 'drop-after');
  d.over = { sid: sid, before: before };
});
document.addEventListener('drop', function (ev) {
  var d = state.drag;
  if (!d) return;
  var row = ev.target.closest ? ev.target.closest('.row[data-session]') : null;
  if (!row || row.getAttribute('data-group') !== d.key) return;
  ev.preventDefault();
  var rect = row.getBoundingClientRect();
  applyDrop(d.sid, row.getAttribute('data-session'), ev.clientY < rect.top + rect.height / 2);
});
document.addEventListener('dragend', endDrag);


(function setupNotifications() {
  var notice = document.getElementById('notifyNotice');
  var btn = document.getElementById('notifyBtn');
  if (vsapi || !window.Notification) return;
  if (Notification.permission === 'default') notice.className = 'notice show';
  btn.addEventListener('click', function () {
    Notification.requestPermission().then(function () { notice.className = Notification.permission === 'granted' ? 'notice' : 'notice show'; });
  });
})();

if (vsapi) {
  window.addEventListener('message', function (ev) {
    var m = ev.data || {};
    if (m.type === 'snapshot' && m.data) onSnapshot(m.data);
    else if (m.type === 'endResult') onEndResult(m);
    else if (m.type === 'unarchiveResult') onUnarchiveResult(m);
    else if (m.type === 'retitleResult') onRetitleResult(m);
    else if (m.type === 'muteResult') onMuteResult(m);
    else if (m.type === 'sortModeResult') onSortModeResult(m);
    else if (m.type === 'orderResult') onOrderResult(m);
    else if (m.type === 'searchResult') onSearchResult(m.data);
    else if (m.type === 'openResult') {
      if (m.restoredTo) applyRestore(m.sessionId, m.restoredTo);
      if (m.ok) flash(m.sessionId, 'resumed', 'jumped');
      else { if (m.message && m.message !== 'copied resume command' && m.message !== 'transcript no longer exists') notice('open failed: ' + m.message); flash(m.sessionId, m.message || 'copied', m.ok === false && /already at|failed/.test(m.message || '') ? 'error' : 'copied'); }
    }
    else if (m.type === 'usageResult') onUsageResult(m);
    else if (m.type === 'focusSearch') qEl.focus();
  });
  send({ type: 'refresh' });
} else {
  (function poll() {
    api('GET', '/api/sessions').then(function (res) {
      if (res.ok) onSnapshot(res.body);
      else { var b = document.getElementById('banner'); b.className = 'banner show'; b.textContent = (res.body && res.body.error) || ('server error ' + res.status); }
    }).catch(function () { var b = document.getElementById('banner'); b.className = 'banner show'; b.textContent = 'Dashboard server is not responding. Is server.cjs still running?'; })
      .then(function () { setTimeout(poll, POLL_MS); });
  })();
}
</script>
</body>
</html>
