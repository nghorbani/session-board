      files = files.concat(filesTouchedIn(row.items));
    });
    if (!files.length) return;
    var fsec = document.createElement('div'); fsec.className = 'fsec';
    var h = document.createElement('div'); h.className = 'fsec-h';
    h.textContent = (sec.heading || sectionLabel(sec)) + ' · ' + fmtClock(sec.at);
    fsec.appendChild(h);
    files.forEach(function (f) {
      var fp = document.createElement('button'); fp.className = 'fp'; fp.textContent = f.path;
      fp.addEventListener('click', function () { dispatchLink('path', f.path); });
      fsec.appendChild(fp);
    });
    view.appendChild(fsec);
  });
  if (!view.children.length) {
    var empty = document.createElement('div'); empty.className = 'empty-state'; empty.textContent = 'no files changed yet';
    view.appendChild(empty);
  }
  reader.appendChild(view);
  if (missing.length) {
    missing.forEach(function (id) { state.bodiesPending[id] = true; });
    call({ type: 'bodies', stepIds: missing, generation: state.generation }).then(function (reply) {
      ((reply && reply.items) || []).forEach(function (item) {
        delete state.bodiesPending[item.stepId];
        if (!item.stale) state.bodies[item.stepId] = item;
      });
      if (state.lens === 'files') renderFilesView();
    });
  }
}

// -- body batching: load texts for sections near the viewport --------------------------------

function queueVisibleBodies() {
  if (state.lens === 'files') return;
  var reader = document.getElementById('reader');
  var nodes = reader.querySelectorAll('[data-step-body]');
  // One viewport above the reader to one below it, in window coordinates. A node is measured
  // the same way (its bounding box): offsetTop would be relative to the node's own row, which
  // says nothing about where the row sits in a reader scrolled far from its top.
  var box = reader.getBoundingClientRect();
  var top = box.top - reader.clientHeight;
  var bottom = box.bottom + reader.clientHeight;
  function near(node) { var b = node.getBoundingClientRect(); return b.top < bottom && b.bottom > top; }
  var wanted = state.bodyBatchWanted || (state.bodyBatchWanted = Object.create(null));
  Array.prototype.forEach.call(nodes, function (node) {
    if (near(node)) {
      var stepId = node.getAttribute('data-step-body');
      if (stepId && !state.bodies[stepId] && !state.bodiesPending[stepId]) wanted[stepId] = true;
    }
  });
  // work rows need bodies for every tool/subagent item they bundle, even though the wrapping
  // row itself carries no single data-step-body (it summarizes several steps at once).
  Array.prototype.forEach.call(reader.querySelectorAll('[data-work-key]'), function (node) {
    if (near(node)) {
      var key = node.getAttribute('data-work-key');
      var ids = state.workItemsByKey ? state.workItemsByKey[key] : null;
      (ids || []).forEach(function (id) { if (!state.bodies[id] && !state.bodiesPending[id]) wanted[id] = true; });
    }
  });
  if (Object.keys(wanted).length && !state.bodyBatchTimer) {
    state.bodyBatchTimer = setTimeout(flushBodyBatch, BODY_BATCH_DELAY_MS);
  }
}

function flushBodyBatch() {
  state.bodyBatchTimer = null;
  var ids = Object.keys(state.bodyBatchWanted || {});
  state.bodyBatchWanted = Object.create(null);
  if (!ids.length) return;
  ids.forEach(function (id) { state.bodiesPending[id] = true; });
  call({ type: 'bodies', stepIds: ids, generation: state.generation }).then(function (reply) {
    if (!reply || !Array.isArray(reply.items)) return;
    reply.items.forEach(function (item) {
      delete state.bodiesPending[item.stepId];
      if (!item.stale) state.bodies[item.stepId] = item;
    });
    // the lens may have switched to files while this batch was in flight; the reader then
    // holds no [data-step-body] nodes for renderVisibleBodiesOnly to refresh, so the files
    // view would stay without a path it was only waiting on, never asking again
    if (state.lens === 'files') renderFilesView();
    else renderVisibleBodiesOnly();
  });
}

/* After a batch lands, refresh only the body/question/work nodes already in the DOM (not a full
   re-render), so scroll position and open/closed toggles are left alone. */
function renderVisibleBodiesOnly() {
  var reader = document.getElementById('reader');
  Array.prototype.forEach.call(reader.querySelectorAll('[data-step-body]'), function (node) {
    var stepId = node.getAttribute('data-step-body');
    var row = node.closest('.row');
    if (!row) return;
    if (row.classList.contains('k-qa') && node.className.indexOf('qcard') !== -1) fillQuestionBody(node, stepId);
    else if (node.className.indexOf('you-msg') !== -1) { fillTextBody(node, stepId, false); foldYouBodyIfLong(node, stepId); }
    else fillMdBody(node, stepId);
  });
  Array.prototype.forEach.call(reader.querySelectorAll('[data-work-key]'), function (node) {
    var key = node.getAttribute('data-work-key');
    var ids = state.workItemsByKey ? state.workItemsByKey[key] : null;
    if (ids) fillWorkBody(node.querySelector('.body'), ids, key);
  });
}

// -- indexing a compact step map from the sections (so rows can show kind/time/preview) ------

function rebuildCompactIndex() {
  var byId = Object.create(null);
  var workItemsByKey = Object.create(null);
  // the opener steps and in-body step rows do not carry the full compact record (only the
  // service's "steps" array from open/pushes does); this page keeps the latest one it has
  // seen per id across pushes, since a step's kind/time/preview never change once assigned.
  byId = state.compactById || Object.create(null);
  state.sections.forEach(function (sec) {
    (sec.body || []).forEach(function (row) {
      if (row.kind === 'work') workItemsByKey['g-' + row.items[0]] = row.items;
    });
  });
  state.compactById = byId;
  state.workItemsByKey = workItemsByKey;
}

// -- search -----------------------------------------------------------------------------------

function runSearch(q) {
  state.query = q;
  if (!q) { state.hits = []; state.curHit = -1; renderAll(); updateSearchCount(); return; }
  var requestId = ++state.searchRequestId;
  call({ type: 'search', query: q }).then(function (reply) {
    if (!reply || reply.requestId !== undefined && state.searchRequestId !== requestId) return;
    state.hits = reply.stepIds || [];
    state.curHit = state.hits.length ? 0 : -1;
    state.hitsCapped = Boolean(reply.capped);
    if (state.hits.length) state.showAllTools = true;
    renderAll();
    updateSearchCount();
    if (state.curHit !== -1) jumpToHit();
  });
}

function updateSearchCount() {
  var el = document.getElementById('count');
  if (!state.query) { el.textContent = ''; return; }
  if (!state.hits.length) { el.textContent = 'no hits'; return; }
  el.textContent = (state.curHit + 1) + ' of ' + state.hits.length + (state.hitsCapped ? '+' : '');
}

function moveHit(delta) {
  if (!state.hits.length) return;
  state.curHit = (state.curHit + delta + state.hits.length) % state.hits.length;
  updateSearchCount();
  jumpToHit();
}

function jumpToHit() {
  var stepId = state.hits[state.curHit];
  if (!stepId) return;
  if (!state.bodies[stepId]) {
    call({ type: 'bodies', stepIds: [stepId], generation: state.generation }).then(function (reply) {
      ((reply && reply.items) || []).forEach(function (item) { if (!item.stale) state.bodies[item.stepId] = item; });
      scrollToStepId(stepId);
    });
  } else {
    scrollToStepId(stepId);
  }
}

function scrollToStepId(stepId) {
  // make sure the owning section is in the fully-rendered window, open any folded work list
  // that holds it, then scroll; a step bundled into a Work line is reached by its group key.
  var secs = visibleSections();
  var idx = -1;
  secs.forEach(function (sec, i) { if (sectionStepIds(sec).indexOf(stepId) !== -1) idx = i; });
  if (idx !== -1) anchorIndex = idx;
  renderReader();
  var target = document.getElementById('step-' + stepId);
  if (!target) {
    // the id may be bundled inside a Work line's group; open that line's detail list.
    Object.keys(state.workItemsByKey || {}).forEach(function (key) {
      if (state.workItemsByKey[key].indexOf(stepId) !== -1) {
        state.openWork[key] = true;
        var node = document.querySelector('[data-work-key="' + key + '"] .worklist');
        if (node) node.classList.add('open');
        target = document.getElementById(key.replace(/^g-/, 'step-')) || document.querySelector('[data-work-key="' + key + '"]');
      }
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.cur-hit'), function (n) { n.classList.remove('cur-hit'); });
  if (target) { target.classList.add('cur-hit'); target.scrollIntoView({ block: 'center' }); }
  renderRail();
}

var qInput = document.getElementById('q');
qInput.addEventListener('input', function () {
  clearTimeout(state.searchTimer);
  var val = qInput.value;
  state.searchTimer = setTimeout(function () { runSearch(val.trim()); }, SEARCH_DEBOUNCE_MS);
});
qInput.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter') { clearTimeout(state.searchTimer); moveHit(ev.shiftKey ? -1 : 1); }
});
document.getElementById('next').addEventListener('click', function () { moveHit(1); });
document.getElementById('prev').addEventListener('click', function () { moveHit(-1); });
document.getElementById('notesJump').addEventListener('click', function () { jumpToNote(1); });
document.getElementById('sendAllNotes').addEventListener('click', function () {
  var btn = document.getElementById('sendAllNotes');
  btn.disabled = true;
  call({ type: 'notesSendAll' }).then(function (reply) {
    btn.disabled = false;
    if (reply && reply.message) flashNotice(reply.message);
    if (reply && !reply.ok && reply.message === 'On the clipboard. Paste it into the session.' && reply.text) copyToClipboard(reply.text);
  });
});
document.getElementById('decisions').addEventListener('click', function () { toggleLens('decisions'); });
document.getElementById('allTools').addEventListener('change', function (ev) { state.showAllTools = ev.target.checked; renderReader(); queueVisibleBodies(); });
document.getElementById('follow').addEventListener('change', function (ev) {
  state.follow = ev.target.checked;
  if (state.follow) scrollToEnd();
});

// -- scrolling, follow, edge bars, seen ------------------------------------------------------

function scrollToSectionIndex(i) {
  var secs = visibleSections();
  if (i < 0 || i >= secs.length) return;
  anchorIndex = i;
  renderReader();
  var el = document.getElementById('sec-' + sectionKey(secs[i], i));
  if (el) el.scrollIntoView({ block: 'start' });
}

function scrollToEnd() {
  var secs = visibleSections();
  anchorIndex = secs.length - 1;
  renderReader();
  var reader = document.getElementById('reader');
  reader.scrollTo(0, reader.scrollHeight);
}

function scrollToEndOnLoad() {
  var qp = !vsapi ? new URLSearchParams(window.location.search) : null;
  var top = qp && qp.get('top') === '1';
  if (top) { anchorIndex = 0; renderReader(); return; }
  anchorIndex = visibleSections().length - 1;
  scrollToEnd();
}

function maybeStickToBottom() {
  // Follow means "stay at the end", full stop: it only turns itself off on a manual scroll
  // away from the bottom (the reader's own scroll handler), never because state.atBottom
  // happened to read stale from before this push grew the content past the viewport.
  if (state.follow) scrollToEnd();
  else updateEdgeBars();
}

function updateEdgeBars() {
  var reader = document.getElementById('reader');
  var atTop = reader.scrollTop <= 20;
  var atBottom = reader.scrollTop + reader.clientHeight >= reader.scrollHeight - 20;
  state.atTop = atTop;
  state.atBottom = atBottom;
  var endBar = document.getElementById('endBar');
  if (state.lens === 'files') { endBar.style.display = 'none'; return; }
  endBar.style.display = '';
  var secs = visibleSections();
  var pill = document.getElementById('endPill');
  if (atBottom) {
    pill.textContent = secs.length > 1 ? 'You are at the end. ' + (secs.length - 1) + ' sections above.' : 'You are at the end.';
  } else {
    var below = Math.max(0, secs.length - 1 - anchorIndex);
    pill.textContent = below ? 'Jump to the end (' + below + ' section' + (below === 1 ? '' : 's') + ' below)' : 'Jump to the end';
  }
}

document.getElementById('endPill').addEventListener('click', function () {
  var reader = document.getElementById('reader');
  if (state.atBottom) reader.scrollTo({ top: 0, behavior: 'smooth' });
  else reader.scrollTo({ top: reader.scrollHeight, behavior: 'smooth' });
});

var scrollTicking = false;
document.getElementById('reader').addEventListener('scroll', function () {
  if (scrollTicking) return;
  scrollTicking = true;
  requestAnimationFrame(function () {
    scrollTicking = false;
    updateEdgeBars();
    expandNearbyStubs();
    queueVisibleBodies();
    updateRailCurrent();
    if (!state.atBottom && state.follow) {
      state.follow = false;
      document.getElementById('follow').checked = false;
    }
    scheduleSeenUpdate();
  });
});

function updateRailCurrent() {
  var reader = document.getElementById('reader');
  var heads = reader.querySelectorAll('[data-anchor]');
  var curAnchor = null;
  for (var i = 0; i < heads.length; i++) {
    var r = heads[i].getBoundingClientRect();
    var readerRect = reader.getBoundingClientRect();
    if (r.top - readerRect.top <= 24) curAnchor = heads[i].getAttribute('data-anchor');
    else break;
  }
  Array.prototype.forEach.call(document.querySelectorAll('.sec-entry'), function (entry) {
    entry.classList.toggle('cur', entry.getAttribute('data-anchor') === curAnchor);
  });
  var curEntry = document.querySelector('.sec-entry.cur .txt');
  document.getElementById('railCurTurn').textContent = curEntry ? curEntry.textContent : 'Story';
}

// "seen" tracking: while the tab is visible, debounce-send the last step currently in view.
function scheduleSeenUpdate() {
  clearTimeout(state.seenTimer);
  state.seenTimer = setTimeout(function () {
    if (document.hidden) return;
    var reader = document.getElementById('reader');
    var rows = reader.querySelectorAll('[data-step]');
    var readerRect = reader.getBoundingClientRect();
    var lastVisible = null;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i].getBoundingClientRect();
      if (r.top < readerRect.bottom) lastVisible = rows[i].getAttribute('data-step');
      else break;
    }
    if (lastVisible && lastVisible !== state.lastSeenSent) {
      state.lastSeenSent = lastVisible;
      call({ type: 'seen', stepId: lastVisible });
    }
  }, SEEN_DEBOUNCE_MS);
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) scheduleSeenUpdate(); });

// -- compact index maintenance on open / pushes ----------------------------------------------

var _mergeSections = mergeSections;
mergeSections = function (sections, strip, isReset) {
  _mergeSections(sections, strip, isReset);
  rebuildCompactIndex();
};

// a fresh open() reply also carries the flat "steps" compact list (kind/time/preview per step,
// including ones bundled into Work rows that section bodies only reference by id); fold it into
// compactById once up front so work-line summaries and timestamps have something to read before
// any body text has loaded.
var _openSession = openSession;
openSession = function () {
  state.compactById = Object.create(null);
  startPolling();
  if (!SESSION_ID) { showError('no session to show'); return; }
  call({ type: 'open' }).then(function (reply) {
    if (!reply || !reply.ok) { showError((reply && reply.message) || 'could not open this session'); return; }
    state.loaded = true;
    state.title = reply.title || 'Session ' + SESSION_ID.slice(0, 8);
    (reply.steps || []).forEach(function (s) { state.compactById[s.id] = s; });
    state.sections = reply.sections || [];
    state.strip = reply.strip || null;
    state.generation = reply.generation || 0;
    state.indexing = Boolean(reply.indexing);
    state.seenStepId = reply.seenStepId || null;
    state.notes = reply.notes || [];
    document.getElementById('title').textContent = state.title;
    document.getElementById('sub').textContent = 'Session ' + SESSION_ID.slice(0, 8) + (reply.counts && reply.counts.unreadable ? ' · ' + reply.counts.unreadable + ' unreadable lines' : '');
    rebuildCompactIndex();
    renderIndexNote();
    renderStrip();
    renderAll();
    renderNotesJumpLabel();
    scrollToEndOnLoad();
  });
};

// -- narrow layout: outline drawer -----------------------------------------------------------

function toggleDrawer() {
  state.drawerOpen = !state.drawerOpen;
  document.getElementById('rail').classList.toggle('open', state.drawerOpen);
  document.getElementById('railCar').textContent = state.drawerOpen ? '▾' : '▸';
}
function closeDrawer() {
  if (!state.drawerOpen) return;
  state.drawerOpen = false;
  document.getElementById('rail').classList.remove('open');
  document.getElementById('railCar').textContent = '▸';
}
document.getElementById('railToggle').addEventListener('click', toggleDrawer);

// -- boot --------------------------------------------------------------------------------

openSession();
</script>
</body>
</html>
